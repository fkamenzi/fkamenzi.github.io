
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 09</title>

    <style>
        body {
            background-color: #ffffff;
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 480px;
            margin: 20px auto;
            padding: 10px;
            background-color: white;
            border: 3px solid #eeeeee;
            box-shadow: 0 5px 15px gray;
        }

        .box1 {
            background-color: lightblue;
            border: 10px double tomato;
            margin: 10px 0 20px;
            font-size: 32px;
            font-weight: bold;
        }

        .box2 {
            background-color: yellow;
            border: 3px solid dodgerblue;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 32px;
            font-weight: bold;
        }

        .box3 {
            background-color: mediumseagreen;
            border: 10px dotted gray;
            margin: 20px 0 10px;
            font-size: 32px;
            font-weight: bold;
        }

        .note {
            color: red;
            font-size: 28px;
            font-style: italic;
            text-align: right;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box1">
            Hello World
        </div>

        <div class="box2">
            Hello World
        </div>

        <div class="box3">
            Hello World
        </div>

    </div>

    <p class="note">
        * Note colors, backgrounds and borders.
    </p>

</body>
</html>
